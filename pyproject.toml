[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-platform"
version = "0.1.0"
description = "Institutional-quality AI quantitative research and paper-trading platform (research + paper trading only, NO live trading)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.6",
    "pandas>=2.0",
    "numpy>=1.26",
    "pyarrow>=14",
    "duckdb>=0.10",
    "pyyaml>=6.0",
    "typer>=0.9",
    "rich>=13",
    "httpx>=0.27",
    "structlog>=24",
    "scipy>=1.11",
]

[project.optional-dependencies]
dashboard = ["streamlit>=1.30", "plotly>=5.20"]
bloomberg = []  # blpapi must be installed from Bloomberg's own index; see docs/BLOOMBERG_SETUP.md
ibkr = ["ib-async>=2.0"]
excel = ["openpyxl>=3.1"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.8",
]

[project.scripts]
quantctl = "quant_platform.cli.main:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
quant_platform = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
target-version = "py311"
line-length = 110
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
packages = ["quant_platform"]
ignore_missing_imports = true
warn_unused_ignores = true
