name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (fresh checkout, no paid services)
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: python -m ruff check src tests
      - name: Test
        run: python -m pytest
      - name: CLI smoke (offline)
        run: |
          python -m quant_platform.cli.main doctor
          python -m quant_platform.cli.main config check
          python -m quant_platform.cli.main paper doctor
      - name: Offline demo
        run: python -m quant_platform.cli.main demo
